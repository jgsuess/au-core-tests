id: fhirfrog.au-core-tests
canonical: http://fhirfrog.org/fhir/au-core-tests
name: FhirFrogAUCoreTests
title: "FHIR Frog AU Core Conformance Tests"
description: >-
  A companion Test IG for AU Core (http://hl7.org.au/fhir/core/): fhir-frog
  TestScript resources exercising AU Core's SHALL-level conformance
  requirements, originally developed as part of the gap analysis in
  fhirfrog/au-core-compiler and broken out here as its own standalone,
  continuously-built package. Depends on the AU Core IG but is not part of
  it, does not modify it, and is not the only such Test IG that could exist
  against the same base - see fhirfrog/au-core-compiler's README for the
  gap-analysis rationale this Test IG grew out of.
status: draft
version: 0.1.0
fhirVersion: 4.0.1
copyrightYear: 2026+
# Deliberately no releaseLabel: "ci-build" (SUSHI's usual default for an unreleased/CI package)
# makes the IG Publisher install this into the local package cache as "#dev"/"#current" rather
# than the real "0.1.0" version - and that special moniker triggers a live currency check against
# a real package registry on every load (which throws, since this package isn't published
# anywhere), even when only reading from the local cache. A private, offline-only trial package
# needs a concrete version tag instead.
publisher:
  name: FHIR Frog
  url: https://gitlab.com/fhirfrog
dependencies:
  hl7.fhir.au.core: 2.0.0
# TestScript resources are already valid, hand-authored FHIR - authored directly under
# input/resources/ (this repo's own source of truth, no FSH involved) - so this project has
# no input/fshtank/ content, only pre-built instances.
parameters:
  # SUSHI/IG Publisher default is to mark unclassified input/resources
  # instances as "examples"; TestScripts aren't examples of anything, so
  # this is left at IG Publisher's default resource classification instead
  # of forcing example status - revisit once an actual IG Publisher build
  # is attempted (out of scope for this sketch, see README).
  autoload-resources: 'true'
# Explicit page order/titles for the homepage nav - see input/pagecontent/ for content and
# input/includes/menu.xml for the matching top-nav tabs.
pages:
  index.md:
    title: Home
  test-procedure.md:
    title: Test Procedure
  test-targets.md:
    title: Test Targets
  # test-cases.md is a hand-authored index; the au-core-*.md/au-imagingresult.md children are
  # generated at build time (CI step, not checked into git - see .gitlab-ci.yml and
  # docs/planning-strategy.md) by fhir-frog-testscript-render's TestScriptRenderCli, one per
  # TestScript under input/resources/. Filenames here must match exactly what that step writes
  # (<TestScript.id>.md) - see input/pagecontent/test-cases.md's own generation note. Deliberately
  # .md, not .xml: IG Publisher infers "xml" page generation (XSLT-templated) from a bare .xml
  # extension, which tries to run an already-rendered HTML fragment through an XSLT transform
  # meant for a different kind of source and fails outright ("Processing terminated by
  # xsl:message", confirmed by a real failed build) - a .md page's raw HTML block is passed
  # through unprocessed by the markdown renderer instead, which is the effect actually wanted.
  test-cases.md:
    title: Test Cases
    au-core-allergyintolerance.md:
      title: AU Core AllergyIntolerance
    au-core-condition.md:
      title: AU Core Condition
    au-core-encounter.md:
      title: AU Core Encounter
    au-core-healthcareservice.md:
      title: AU Core HealthcareService
    au-core-immunization.md:
      title: AU Core Immunization
    au-core-location.md:
      title: AU Core Location
    au-core-medication.md:
      title: AU Core Medication
    au-core-medicationrequest.md:
      title: AU Core MedicationRequest
    au-core-medicationstatement.md:
      title: AU Core MedicationStatement
    au-core-diagnosticresult.md:
      title: AU Core Diagnostic Result Observation
    au-core-diagnosticresult-path.md:
      title: AU Core Pathology Result Observation
    au-core-smokingstatus.md:
      title: AU Core Smoking Status Observation
    au-core-sexassignedab.md:
      title: AU Core Sex Assigned at Birth extension
    au-imagingresult.md:
      title: AU Imaging Result Observation
    au-core-organization.md:
      title: AU Core Organization
    au-core-patient.md:
      title: AU Core Patient
    au-core-practitioner.md:
      title: AU Core Practitioner
    au-core-practitionerrole.md:
      title: AU Core PractitionerRole
    au-core-procedure.md:
      title: AU Core Procedure
    au-core-relatedperson.md:
      title: AU Core RelatedPerson

stages:
  - build
  - mirror
  - trigger-build

# Real IG Publisher build on every push - a correctness gate, not just SUSHI's shallower check.
# -tx n/a skips slow/network-dependent terminology validation (see README).
build:
  stage: build
  image: node:20-bookworm
  cache:
    key: fhir-frog-testscript-render-m2
    paths:
      - .m2/repository
  variables:
    MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  before_script:
    # ruby/jekyll: the IG Publisher's "Run Template" step shells out to a real jekyll binary to
    # generate HTML output - not bundled in the jar, confirmed missing by a real failed pipeline
    # run ("Cannot run program jekyll ... No such file or directory") before this was added.
    # graphviz: the homepage's PlantUML component/architecture diagram needs the `dot` layout
    # engine - sequence diagrams render fine without it, but PlantUML falls back to a much
    # cruder layout for component/package diagrams when GRAPHVIZ_DOT/dot isn't found.
    # openjdk-17-jdk-headless/maven: fhir-frog-testscript-render (below) is a Maven module, not
    # just a jar to run - needs a real JDK + build tool, not only the JRE the Publisher itself
    # needs.
    - apt-get update && apt-get install -y --no-install-recommends default-jre-headless curl ruby-full build-essential graphviz openjdk-17-jdk-headless maven git
    - gem install jekyll bundler --no-document
    - npm install -g fsh-sushi
    - curl -sL -o publisher.jar https://github.com/HL7/fhir-ig-publisher/releases/latest/download/publisher.jar
    # Test Cases pages: rendered from each input/resources/ TestScript by fhir-frog's
    # fhir-frog-testscript-render module (a genuine cross-repo dependency - that module lives in
    # fhir-frog, not here) into input/pagecontent/<id>.md, matching the filenames explicitly
    # listed under test-cases.md in sushi-config.yaml's pages: block. Built fresh from fhir-frog's
    # own main on every run rather than vendored/pinned here - no package-registry publishing
    # exists for it yet, and this project's own au-core-tests content changes far more often than
    # the renderer itself, so pinning would mean remembering to bump a version by hand every time
    # fhir-frog's main moves. See docs/planning-strategy.md and README.md's "Build" section for
    # how to run this same step locally to preview before pushing.
    #
    # fhir-frog uses jgitver-maven-plugin (a core build extension, .mvn/extensions.xml) to compute
    # every module's real version from git tag/commit history at build time - the "0-SNAPSHOT"
    # literal in its own pom.xml files is just jgitver's placeholder, never the real version. A
    # SHALLOW clone (--depth 1, tried first here) has no reachable tags/history for jgitver to
    # compute anything from, so it falls back to a bogus "0.0.0-SNAPSHOT" - and that specific
    # fictional version genuinely doesn't exist anywhere (confirmed: it still failed identically
    # even with every Maven repository lookup forced through real Maven Central, ruling out
    # fhir-frog's separate private "fhirfrog-gitlab" package registry as the cause). A full clone
    # (no --depth) alone still isn't enough, though: it makes jgitver compute a real-looking
    # version (e.g. "0.2.1-SNAPSHOT" instead of "0.0.0-SNAPSHOT"), but that computed version then
    # leaks onto the external ca.uhn.hapi.fhir:hapi-fhir-bom BOM import too - a real, reproducible
    # jgitver/Maven interaction on a cold cache, not something specific to this module's own POM
    # (which correctly pins hapi.fhir.version as a plain literal). -Djgitver.skip=true avoids it
    # entirely - confirmed against a genuinely empty local Maven cache, where the identical command
    # that otherwise fails in under 10 seconds now builds a working jar end to end.
    - git clone https://gitlab.com/fhirfrog/fhir-frog.git /tmp/fhir-frog
    - (cd /tmp/fhir-frog && mvn -Djgitver.skip=true -B -q -pl fhir-frog-testscript-render -am package -DskipTests)
    - java -jar /tmp/fhir-frog/fhir-frog-testscript-render/target/fhir-frog-testscript-render-*.jar input/resources input/pagecontent
  script:
    - sushi .
    - java -jar publisher.jar -ig . -tx n/a

# Build-only mirror: gitlab.com/fhirfrog/au-core-tests is canonical; nobody authors on GitHub.
# Pushed here purely so HL7's auto-builder (GitHub-only) has a public repo to build from - see
# docs/planning-strategy.md section 3.
mirror:
  stage: mirror
  image:
    name: alpine/git
    # alpine/git's own ENTRYPOINT is `git`, which swallows GitLab's script wrapper ("git: 'sh' is
    # not a git command" - confirmed by a real failed pipeline run) unless cleared.
    entrypoint: [""]
  variables:
    # GitLab's default shallow clone (depth 20) breaks a real push to another remote - GitHub's
    # receive-pack rejects the incomplete object graph ("did not receive expected object ...",
    # confirmed by a real failed pipeline run). Full history needed to push, not just to browse.
    GIT_DEPTH: "0"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    # The token is stored base64-encoded (GITHUB_MIRROR_TOKEN_B64): GitLab refuses to mask a value with the
    # underscores of a GitHub fine-grained token, and an unmasked secret would show in job logs.
    - GH_TOKEN="$(printf %s "${GITHUB_MIRROR_TOKEN_B64}" | base64 -d)"
    - git remote add github "https://x-access-token:${GH_TOKEN}@github.com/jgsuess/au-core-tests.git"
    # HEAD:main (unqualified) fails here - GitLab CI checks out a detached HEAD (a bare commit
    # object, not a ref), so git can't guess the destination ref name; needs full refs/heads/main.
    - git push github HEAD:refs/heads/main --force

# Explicit programmatic trigger, documented by FHIR/auto-ig-builder, instead of relying on
# GitHub's own webhook delivery firing on a mirrored (non-interactive) push - see
# docs/planning-strategy.md section 3.
trigger-build:
  stage: trigger-build
  image: alpine
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  before_script:
    - apk add --no-cache curl
  script:
    - >
      curl -sf -X POST "https://us-central1-fhir-org-starter-project.cloudfunctions.net/ig-commit-trigger"
      -H "Content-type: application/json"
      --data "{\"ref\": \"refs/heads/main\", \"repository\": {\"full_name\": \"jgsuess/au-core-tests\"}}"
